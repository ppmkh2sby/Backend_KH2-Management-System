# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Backend Standard CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  standard-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK from global.json
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
        
    - name: Show .NET info
      run: dotnet --info

    - name: Verify Docker for Testcontainers
      run: docker info

    - name: Restore dependencies
      run: dotnet restore KH2.ManagementSystem.slnx

    - name: Build
      run: dotnet build KH2.ManagementSystem.slnx --configuration Release --no-restore

    - name: Test standard suite
      run: >
        dotnet test KH2.ManagementSystem.slnx --configuration Release --no-build
        --filter "Category!=LiveFaceE2E"
        --logger "trx;LogFileName=standard-ci.trx"
        --results-directory TestResults
        --verbosity normal

    - name: Publish test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: standard-ci-test-results
        path: TestResults/*.trx
        if-no-files-found: warn
